language: 'en-US'
tone_instructions: |
  Informative Next.js/React/TS student review: Lines X-Y: [describe issue]. Use [HTML/TS/React/Next.js fix]. Reference line numbers. Actionable suggestions with semantic tags/hooks. Brief explanation.
early_access: true
reviews:
  profile: assertive
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
  request_changes_workflow: false
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  enable_prompt_for_ai_agents: false
  changed_files_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords: ['coderabbit-ignore']
  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: |
        Student Next.js/React/TS review:
          - Check server/client component boundaries ('use client' directive)
          - Prefer Server Components by default; flag unnecessary 'use client'
          - App Router conventions: layouts, loading, error, not-found patterns
          - Route handlers and Server Actions: proper error handling, revalidation
          - Next.js data fetching: fetch, cache, revalidate patterns
          - Image/next/image usage and optimization
          - Prefer semantic HTML first; include ARIA guidance only when semantics are insufficient
          - Explain TypeScript errors with minimal type-signature guidance (avoid full inline patches)
          - Hook issues: explain deps/memoization need
          - NEVER write FULL code fixes inline
    - path: '**/app/**/*.{ts,tsx}'
      instructions: |
        App Router specific:
          - Ensure proper file conventions (page.tsx, layout.tsx, loading.tsx, error.tsx)
          - Check for correct segment-level config (dynamic, revalidate, etc.)
          - Verify params and searchParams handling
    - path: '**/middleware.ts'
      instructions: |
        Middleware review:
          - Check matcher config correctness
          - Proper request/response handling
          - Avoid heavy operations in middleware
chat:
  auto_reply: true
